[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-plus-one"
version = "0.4.0"
description = "A laboratory for 3+1 symmetry breaking, tetrahedral dynamics, history transport, and transverse instability."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "The Three Plus One Network contributors"}
]
dependencies = []

[project.scripts]
three-plus-one = "threeplusone.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
