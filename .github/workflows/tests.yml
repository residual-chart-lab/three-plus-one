name: tests

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Install optional high-precision diagnostic dependency
        if: startsWith(github.ref, 'refs/heads/research/full-phase-cocycle-')
        run: python -m pip install mpmath==1.4.1
      - name: Run future-readout coordinate diagnostic
        if: startsWith(github.ref, 'refs/heads/research/full-phase-cocycle-')
        run: python examples/xnor_future_phase_coordinates.py
      - name: Run phase-hidden coupling diagnostic
        if: startsWith(github.ref, 'refs/heads/research/full-phase-cocycle-')
        run: python examples/xnor_phase_hidden_coupling.py
      - name: Run full phase cocycle scan
        if: startsWith(github.ref, 'refs/heads/research/full-phase-cocycle-')
        run: python examples/xnor_full_phase_cocycle.py
      - name: Run hidden-tail closure diagnostic
        if: startsWith(github.ref, 'refs/heads/research/hidden-tail-closure-')
        run: python examples/xnor_hidden_tail_closure.py
      - name: Run analytic selector tail decomposition
        if: startsWith(github.ref, 'refs/heads/research/analytic-selector-tail-')
        run: python examples/xnor_analytic_selector_tail.py
      - name: Run direct SGD tail scaling diagnostic
        if: startsWith(github.ref, 'refs/heads/research/sgd-tail-scaling-')
        run: python examples/xnor_sgd_tail_scaling.py
      - name: Run one-epoch selector normal-form diagnostic
        if: startsWith(github.ref, 'refs/heads/research/sgd-tail-scaling-')
        run: python examples/xnor_selector_tail_normal_form.py
      - name: Run long-horizon selector asymptotics
        if: startsWith(github.ref, 'refs/heads/research/selector-asymptotics-')
        run: python examples/xnor_selector_asymptotics.py
